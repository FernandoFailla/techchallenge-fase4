name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.10"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen --group dev
      - run: make check
